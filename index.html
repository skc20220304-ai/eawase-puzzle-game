<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#fff4f7"><title>えあわせ ぱずる</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div class="logo"><span>✿</span>えあわせ ぱずる</div><button class="sound" id="soundButton" aria-label="音のオンオフ">♪</button></header>
<section class="hero"><p>できたら、うれしい！</p><h1>かわいい えを<br>そろえよう</h1><div class="cloud c1">☁</div><div class="cloud c2">☁</div></section>
<section class="game-card"><div class="picture-info"><div><span class="label">きょうの え</span><strong id="pictureName">あめあがりの ねこ</strong></div><button class="new-picture" id="newPicture">ちがう え</button></div>
<div class="difficulty" aria-label="むずかしさ"><button data-level="easy" class="selected">かんたん<br><small>8 うごかす</small></button><button data-level="normal">ふつう<br><small>28 うごかす</small></button><button data-level="hard">むずかしい<br><small>80 うごかす</small></button></div>
<div class="puzzle-wrap"><div class="puzzle" id="puzzle" role="grid" aria-label="えあわせパズル"></div><div class="sparkles" id="sparkles" aria-hidden="true"></div></div>
<p class="message" id="message" aria-live="polite">あいている ばしょの となりを おしてね</p><div class="actions"><button class="hint" id="hintButton">ヒント</button><button class="restart" id="restartButton">もういちど</button></div><div class="finished-actions" id="finishedActions" hidden><span>🎉 えが できたよ！</span><button id="nextButton">ちがう えで あそぶ</button></div></section>
<section class="collection"><div><span>🏅 できた かず</span><strong id="stars">0</strong></div><p>たくさん できたね！</p></section></main>
<div class="celebration" id="celebration" hidden><div class="celebrate-box"><span class="big-star">⭐</span><p>すごい！できた！</p><h2 id="praise">えあわせ名人！</h2><button id="nextButton">つぎの えで あそぶ</button></div></div><script src="app.js"></script></body></html>
